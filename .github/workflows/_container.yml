name: Container

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to build and validate
        required: true
        type: string
      save_image:
        description: Retain the tested amd64 image for deployment without rebuilding
        required: false
        default: false
        type: boolean
      fresh_runtime:
        description: Rebuild runtime layers without cache for scheduled security validation
        required: false
        default: false
        type: boolean
      source_build:
        description: Validate the complete Docker source build
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  frontend:
    if: ${{ !inputs.source_build }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/build-frontend
        with:
          upload-artifact: 'true'

  binary:
    if: ${{ !inputs.source_build }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - id: toolchains
        run: ruby release/toolchains.rb >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-binary
        with:
          rust: ${{ steps.toolchains.outputs.rust }}
          target: x86_64-unknown-linux-gnu
          platform: linux-amd64
          rust-image: ${{ steps.toolchains.outputs.rust_image }}
        env:
          CPR_GIT_SHA: ${{ inputs.ref }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-proxy-rs-linux-amd64
          path: dist/binaries/linux-amd64/
          if-no-files-found: error
          retention-days: 7

  container:
    needs: [frontend, binary]
    if: always() && !cancelled()
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CPR_IMAGE: codex-proxy-rs:ci-${{ inputs.ref }}
      TRIVY_QUIET: 'true'
      TRIVY_SKIP_VERSION_CHECK: 'true'
    steps:
      # 上游失败必须传递给已有的容器检查，不能让必需状态变成 skipped
      - name: Require prebuilt inputs
        if: ${{ !inputs.source_build }}
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BINARY_RESULT: ${{ needs.binary.result }}
        run: test "$FRONTEND_RESULT" = success && test "$BINARY_RESULT" = success

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Image identity
        id: identity
        shell: bash
        run: |
          ruby -ryaml -rtime <<'RUBY' >> "$GITHUB_OUTPUT"
          version = YAML.load_file("release/version.yaml").fetch("version").delete_prefix("v")
          abort("invalid version") unless version.match?(/\A\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.+-]+)?\z/)
          puts "version=#{version}"
          puts "build_time=#{Time.now.utc.iso8601}"
          puts "security_refresh=#{Time.now.utc.strftime('%Y-%m-%d')}"
          RUBY

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download frontend
        if: ${{ !inputs.source_build }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: dist/docker/web/dist

      - name: Download binary
        if: ${{ !inputs.source_build }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-proxy-rs-linux-amd64
          path: dist/docker-artifacts/codex-proxy-rs-linux-amd64

      - name: Prepare prebuilt image
        if: ${{ !inputs.source_build }}
        run: |
          install -Dm755 dist/docker-artifacts/codex-proxy-rs-linux-amd64/codex-proxy-rs dist/docker/linux-amd64/codex-proxy-rs

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ inputs.source_build && 'runtime' || 'runtime-prebuilt' }}
          platforms: linux/amd64
          build-args: |
            CPR_PREBUILT_DIR=dist/docker
            CPR_GIT_SHA=${{ inputs.ref }}
            CPR_SECURITY_REFRESH=${{ steps.identity.outputs.security_refresh }}
          load: true
          tags: ${{ env.CPR_IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
          no-cache-filters: |
            runtime-base
            runtime
            runtime-prebuilt
          cache-from: type=gha,scope=runtime-${{ inputs.source_build && 'source' || 'prebuilt' }}
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope=runtime-{0}', inputs.source_build && 'source' || 'prebuilt') || '' }}

      - name: Verify runtime image
        uses: ./.github/actions/verify-container
        with:
          image: ${{ env.CPR_IMAGE }}
          platform: linux/amd64
          artifact-name: container-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-amd64

      - name: Save the verified image
        if: inputs.save_image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpr-image"
          docker image save "$CPR_IMAGE" | gzip -1 > "$RUNNER_TEMP/cpr-image/image.tar.gz"
          python3 release/verified_image.py create \
            --image "$CPR_IMAGE" \
            --archive "$RUNNER_TEMP/cpr-image/image.tar.gz" \
            --output "$RUNNER_TEMP/cpr-image/manifest.json"

      - name: Upload immutable image
        if: inputs.save_image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpr-image-linux-amd64-${{ inputs.ref }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cpr-image/image.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload image proof
        if: inputs.save_image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpr-proof-${{ inputs.ref }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cpr-image/manifest.json
          retention-days: 14
          if-no-files-found: error
