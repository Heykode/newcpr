name: Reusable Container

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to build and validate
        required: true
        type: string
      save_image:
        description: Retain the tested amd64 image for deployment without rebuilding
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CPR_IMAGE: codex-proxy-rs:ci-${{ inputs.ref }}
      TRIVY_QUIET: 'true'
      TRIVY_SKIP_VERSION_CHECK: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image identity
        id: identity
        shell: bash
        run: |
          ruby -ryaml -rtime <<'RUBY' >> "$GITHUB_OUTPUT"
          version = YAML.load_file("release/version.yaml").fetch("version").delete_prefix("v")
          abort("invalid version") unless version.match?(/\A\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.+-]+)?\z/)
          puts "version=#{version}"
          puts "build_time=#{Time.now.utc.iso8601}"
          RUBY

      - name: Cache Cargo mounts
        id: cargo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/container-cargo/registry
            ${{ runner.temp }}/container-cargo/git
          key: container-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/Cargo.lock', 'backend/**/Cargo.toml', 'deploy/Dockerfile') }}-${{ inputs.ref }}
          restore-keys: |
            container-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/Cargo.lock', 'backend/**/Cargo.toml', 'deploy/Dockerfile') }}-
            container-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      # The GHA layer exporter does not persist RUN --mount=type=cache contents.
      # Keep only dependency source caches here; extracting the Rust target cache
      # can exhaust the runner disk during the post-build hook.
      - name: Restore Cargo mounts to BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          scratch-dir: ${{ runner.temp }}/container-cache-dance
          cache-map: |
            {
              "${{ runner.temp }}/container-cargo/registry": "/usr/local/cargo/registry",
              "${{ runner.temp }}/container-cargo/git": "/usr/local/cargo/git"
            }
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          load: true
          tags: ${{ env.CPR_IMAGE }}
          build-args: |
            CPR_VERSION=${{ steps.identity.outputs.version }}
            CPR_GIT_SHA=${{ inputs.ref }}
            CPR_BUILD_TIME=${{ steps.identity.outputs.build_time }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
          no-cache-filters: |
            runtime-base
            runtime
          cache-from: type=gha,scope=runtime-ci
          cache-to: type=gha,mode=max,scope=runtime-ci

      - name: Verify runtime image
        uses: ./.github/actions/verify-container
        with:
          image: ${{ env.CPR_IMAGE }}
          platform: linux/amd64
          artifact-name: container-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-amd64

      - name: Save the verified image
        if: inputs.save_image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpr-image"
          docker image save "$CPR_IMAGE" | gzip -1 > "$RUNNER_TEMP/cpr-image/image.tar.gz"
          python3 release/verified_image.py create \
            --image "$CPR_IMAGE" \
            --archive "$RUNNER_TEMP/cpr-image/image.tar.gz" \
            --output "$RUNNER_TEMP/cpr-image/manifest.json"

      - name: Upload immutable image
        if: inputs.save_image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpr-image-linux-amd64-${{ inputs.ref }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cpr-image/image.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload image proof
        if: inputs.save_image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpr-proof-${{ inputs.ref }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cpr-image/manifest.json
          retention-days: 14
          if-no-files-found: error
