name: Reusable Container

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to build and validate
        required: true
        type: string
      save_image:
        description: Retain the tested amd64 image for deployment without rebuilding
        required: false
        default: false
        type: boolean
      fresh_runtime:
        description: Rebuild runtime layers without cache for scheduled security validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CPR_IMAGE: codex-proxy-rs:ci-${{ inputs.ref }}
      TRIVY_QUIET: 'true'
      TRIVY_SKIP_VERSION_CHECK: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Image identity
        id: identity
        shell: bash
        run: |
          ruby -ryaml -rtime <<'RUBY' >> "$GITHUB_OUTPUT"
          version = YAML.load_file("release/version.yaml").fetch("version").delete_prefix("v")
          abort("invalid version") unless version.match?(/\A\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.+-]+)?\z/)
          puts "version=#{version}"
          puts "build_time=#{Time.now.utc.iso8601}"
          puts "security_refresh=#{Time.now.utc.strftime('%Y-%m-%d')}"
          RUBY

      # Preserve release compilation directly, without extracting a second copy
      # of a large BuildKit target mount during the post-build cache hook.
      - name: Cache backend compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cpr-ci-cargo
          key: ci-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/Cargo.lock', 'backend/**/Cargo.toml', 'deploy/Dockerfile', 'release/build_ci_backend.sh') }}-${{ inputs.ref }}
          restore-keys: |
            ci-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/Cargo.lock', 'backend/**/Cargo.toml', 'deploy/Dockerfile', 'release/build_ci_backend.sh') }}-

      - name: Load pinned backend toolchain
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          target: backend-toolchain
          platforms: linux/amd64
          load: true
          tags: cpr-ci-backend-toolchain:${{ inputs.ref }}

      - name: Build current backend with cached compilation
        env:
          CPR_CARGO_CACHE: ${{ runner.temp }}/cpr-ci-cargo
          CPR_BACKEND_IMAGE: cpr-ci-backend-toolchain:${{ inputs.ref }}
          CPR_VERSION: ${{ steps.identity.outputs.version }}
          CPR_GIT_SHA: ${{ inputs.ref }}
          CPR_BUILD_TIME: ${{ steps.identity.outputs.build_time }}
        run: bash release/build_ci_backend.sh

      - name: Select runtime cache policy
        id: cache-policy
        shell: bash
        env:
          FRESH_RUNTIME: ${{ inputs.fresh_runtime }}
        run: |
          set -euo pipefail
          if [[ "$FRESH_RUNTIME" == "true" ]]; then
            {
              echo 'no_cache_filters<<EOF'
              echo 'runtime-base'
              echo 'runtime-ci'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'no_cache_filters=' >> "$GITHUB_OUTPUT"
          fi

      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime-ci
          platforms: linux/amd64
          load: true
          tags: ${{ env.CPR_IMAGE }}
          build-args: |
            CPR_PREBUILT_DIR=dist/docker
            CPR_SECURITY_REFRESH=${{ steps.identity.outputs.security_refresh }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
          no-cache-filters: ${{ steps.cache-policy.outputs.no_cache_filters }}
          cache-from: type=gha,scope=runtime-ci
          cache-to: type=gha,mode=max,scope=runtime-ci

      - name: Verify runtime image
        uses: ./.github/actions/verify-container
        with:
          image: ${{ env.CPR_IMAGE }}
          platform: linux/amd64
          artifact-name: container-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-amd64

      - name: Save the verified image
        if: inputs.save_image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpr-image"
          docker image save "$CPR_IMAGE" | gzip -1 > "$RUNNER_TEMP/cpr-image/image.tar.gz"
          python3 release/verified_image.py create \
            --image "$CPR_IMAGE" \
            --archive "$RUNNER_TEMP/cpr-image/image.tar.gz" \
            --output "$RUNNER_TEMP/cpr-image/manifest.json"

      - name: Upload immutable image
        if: inputs.save_image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpr-image-linux-amd64-${{ inputs.ref }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cpr-image/image.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload image proof
        if: inputs.save_image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpr-proof-${{ inputs.ref }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cpr-image/manifest.json
          retention-days: 14
          if-no-files-found: error
