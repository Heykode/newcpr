version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '09:10'
      timezone: Asia/Shanghai
    # 固定官方 Codex Desktop 的 TLS 指纹；升级前必须抓取握手并比对扩展顺序。
    ignore:
      - dependency-name: hyper-rustls
      - dependency-name: reqwest
      - dependency-name: rustls
    groups:
      minor-and-patch:
        # 协议敏感依赖单独提 PR，需握手/读写/压缩回归；不新增全量忽略规则。
        exclude-patterns:
          - aws-lc-rs
          - http-body-util
          - hyper
          - hyper-rustls
          - hyper-tls
          - hyper-util
          - native-tls
          - openssl
          - openssl-src
          - openssl-sys
          - reqwest
          - rustls
          - rustls-native-certs
          - rustls-pki-types
          - tokio
          - tokio-native-tls
          - tokio-rustls
          - tokio-tungstenite
          - tungstenite
          - zstd
          - zstd-safe
          - zstd-sys
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '09:20'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 1
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Shanghai
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
